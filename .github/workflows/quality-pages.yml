name: Quality and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Regression quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, lint, maintainability, and regression validation
        run: npm run quality
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tests/helpers/check-pr-title.mjs
      - name: Audit production dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --json 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -q '"vulnerabilities"'; then
              echo "::error::npm audit reported production dependency vulnerabilities."
              exit "$status"
            fi
            if ! printf '%s' "$output" | grep -Eqi '503|Service Unavailable|ECONN|ETIMEDOUT|EAI_AGAIN|audit endpoint returned an error'; then
              echo "::error::npm audit failed for a non-transient reason."
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::warning::npm audit registry endpoint remained unavailable after 3 attempts; source quality gates passed, so this infrastructure-only outage is not treated as a code regression."

  browser:
    name: Browser privacy and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portable browser validation
        run: npm run test:browser

  deploy:
    name: Deploy validated PWA
    if: github.event_name != 'pull_request'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare release runtime
        run: npm run prepare:runtime
      - name: Prepare production-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/vendor _site/assets/mascots
          cp index.html offline.html manifest.webmanifest version.json sw.js sync-config.js _site/
          cp assets/css/*.css _site/
          cp assets/js/*.js _site/
          cp assets/js/features/*.js _site/
          cp assets/js/ui/*.js _site/
          cp assets/mascots/*.png _site/assets/mascots/
          cp vendor/supabase.min.js _site/vendor/
          cp icons/* _site/icons/
          # pwa-update.js is generated by prepare:runtime with the content-derived
          # account integrity revision. Copy it after canonical assets so the
          # production artifact cannot overwrite the generated delivery keys.
          cp pwa-update.js _site/pwa-update.js
          cp production-ui-audit.css phone-finance-compat.js sync-runtime-compat.js summary-mascots.css summary-mascots.js _site/
          test -f _site/dashboard-interactions-core.css
          test -f _site/liquid-glass.css
          test -f _site/ui-icon-alignment.css
          test -f _site/black-canvas.css
          test -f _site/desktop-ui-phase1.css
          test -f _site/desktop-ux.css
          test -f _site/shell-ui.css
          test -f _site/production-ui-audit.css
          test -f _site/summary-mascots.css
          test -f _site/import-center.css
          test -f _site/import-center.js
          test -f _site/net-worth.css
          test -f _site/net-worth.js
          test -f _site/household-splits.css
          test -f _site/household-splits.js
          test -f _site/pwa-update.js
          test -f _site/brand-icons.js
          test -f _site/projects-calendar.js
          test -f _site/projects-calendar.css
          test -f _site/mobile.css
          test -f _site/cash-flow-summary.js
          test -f _site/form-inputs.js
          test -f _site/application-help.js
          test -f _site/header-tools-compat.js
          test -f _site/phone-finance-compat.js
          test -f _site/summary-mascots.js
          test -f _site/sync-runtime-compat.js
          test -f _site/assets/mascots/mascot-red.png
          test -f _site/assets/mascots/mascot-green.png
          test -f _site/assets/mascots/mascot-blue.png
          test -f _site/assets/mascots/mascot-orange.png
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before first Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45
      - name: Final GitHub Pages deployment retry
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}